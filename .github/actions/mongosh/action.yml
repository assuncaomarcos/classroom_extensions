name: MongoDB Shell

description: Install MongoDB Shell

runs:
  using: 'composite'
  steps:
    - name: Install Mongo Repo
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg curl ca-certificates
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg -o /etc/apt/keyrings/mongodb-server-8.0.gpg --dearmor --yes
        echo "deb [ arch=amd64,arm64 signed-by=/etc/apt/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu $(lsb_release -cs)/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
        sudo apt-get update

    - name: Install MongoDB Shell
      shell: bash
      run: sudo apt-get install -y mongodb-mongosh
